name: Build Android APK (Mirror)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发打包

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出大号私有代码 (Mirror)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MASTER_REPO_PATH }}
          token: ${{ secrets.MASTER_GITHUB_TOKEN }}
          ref: 'main'

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 npm 依赖
        run: npm ci --legacy-peer-deps

      - name: 生成原生 Android 工程 (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 配置 Gradle 缓存与运行环境
        uses: gradle/actions/setup-gradle@v3

      - name: 编译 Release APK (仅针对真机 arm64-v8a 架构加速编译)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 检查并输出生成产物信息
        run: |
          echo "=== 检查生成的 APK 产物 ==="
          ls -lh android/app/build/outputs/apk/release/

      - name: 上传 APK 安装包到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NodeAuth-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
